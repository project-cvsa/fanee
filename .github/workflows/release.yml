name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Bump package versions
        run: |
          find packages -name "package.json" -not -path "*/node_modules/*" \
            -exec sed -i 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.version }}"/g' {} \;

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/*/dist/
          retention-days: 1

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Bump package versions
        run: |
          find packages -name "package.json" -not -path "*/node_modules/*" \
            -exec sed -i 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.version }}"/g' {} \;

      - name: Resolve workspace dependencies
        run: |
          find packages -name "package.json" -not -path "*/node_modules/*" \
            -exec sed -i 's/"workspace:\*"/"^${{ steps.version.outputs.version }}"/g' {} \;

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: packages/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          always-auth: false

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Publish packages to npm
        run: |
          publish_pkg() {
            pkg_name=$(node -p "require('./package.json').name")
            pkg_version=$(node -p "require('./package.json').version")
            if npm view "$pkg_name@$pkg_version" version > /dev/null 2>&1; then
              echo "$pkg_name@$pkg_version is already published, skipping."
              return 0
            fi
            echo "Publishing $pkg_name@$pkg_version..."
            for attempt in 1 2 3; do
              echo "Attempt $attempt..."
              if npm publish --provenance --access public; then
                return 0
              fi
              echo "Publish with provenance failed on attempt $attempt, waiting 5 seconds..."
              sleep 5
            done
            echo "Retrying without --provenance as fallback..."
            npm publish --access public
          }

          for dir in packages/core packages/node packages/react packages/vite packages/solid; do
            (cd "$dir" && publish_pkg)
          done

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
